name: Desktop release

# A tag `desktop-v<version>` (scripts/desktop-release.sh) builds the
# installers for Windows and Linux, signs the update files with the updater
# key and publishes them as a release of this repository. `latest.json`,
# the manifest the app's updater reads, then replaces the one in the
# release `updates`, which holds the feeds of all apps (appcast.xml of the
# Mac app too) so that the Mac and desktop tags do not compete for "latest".
#
# Secrets of the environment `desktop-release`, which only `desktop-v*`
# tags may use: TAURI_SIGNING_PRIVATE_KEY and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD (updater key, see apps/desktop/README.md).
# The releases themselves are written with the workflow's own token.

on:
  push:
    tags: ["desktop-v*"]

concurrency:
  group: desktop-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Create release
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    environment: desktop-release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      id: ${{ steps.create.outputs.id }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The whole history, for the check that the tag is on main.
          fetch-depth: 0
      - name: Tag is on main
        run: |
          # A tag on a commit outside main must not reach the updater key;
          # the build jobs need this job, so they stop here too.
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points to $GITHUB_SHA, which is not on main"
            exit 1
          fi
      - id: version
        name: Tag matches the app version
        run: |
          version="${GITHUB_REF_NAME#desktop-v}"
          app="$(node -p "require('./apps/desktop/package.json').version")"
          if [ "$version" != "$app" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but apps/desktop/package.json says $app"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - id: create
        name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          id="$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$GITHUB_REF_NAME" \
            -f name="Amiscara Agents $VERSION (Windows, Linux)" -F draft=true \
            -f body="Windows: x64-setup.exe oder msi, für ARM-Geräte arm64-setup.exe (nicht signiert, SmartScreen fragt einmal). Linux: AppImage oder deb." \
            --jq .id)"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: release
    environment: desktop-release
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
          # Cross-compiled; Tauri builds only NSIS for ARM64. The updater
          # finds it as `windows-aarch64` in latest.json.
          - name: Windows ARM64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            args: --target aarch64-pc-windows-msvc --bundles nsis
          - name: Linux
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Room for the AppImage, as in ci.yml.
      - name: Free disk space
        if: runner.os == 'Linux'
        working-directory: .
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: WebKitGTK and bundler tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: desktop-release-${{ matrix.name }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/desktop
      # Windows code signing (Authenticode) goes here once there is a
      # certificate: `bundle.windows.signCommand` in tauri.conf.json, see #146.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }}
          releaseId: ${{ needs.release.outputs.id }}
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true

  publish:
    name: Publish release
    needs: [release, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Publish
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/${{ needs.release.outputs.id }}" -F draft=false --silent
      # Published before the manifest moves, so it never points to a draft.
      - name: Update the feed
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern latest.json --dir "$RUNNER_TEMP"
          gh release view updates >/dev/null 2>&1 \
            || gh release create updates --prerelease --target main --title "Update-Feeds" \
              --notes "Feeds für die eingebauten Updates der Apps. Downloads unter den Versionen."
          gh release upload updates "$RUNNER_TEMP/latest.json" --clobber
