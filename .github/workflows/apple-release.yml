name: Apple release

# Builds the Apple apps with the signing data of the environment
# `apple-release` (scripts/apple-ci-secrets.sh, docs/release.md):
#
# - mac: Developer ID signed, notarized and stapled Mac app as a zip,
#   kept as a workflow artifact; a tag also attaches it to a release.
# - testflight: iPhone/iPad app (with the Watch app) and Apple TV app,
#   uploaded to App Store Connect for TestFlight.
#
# Only `main` and tags `apple-v*` run it, like the environment's deployment
# rules; a run from another branch skips both jobs.
#
# A tag `apple-v<version>` runs both; by hand (Actions > Apple release >
# Run workflow, or `gh workflow run apple-release.yml -f target=mac`) one
# of them. The build number is `<CURRENT_PROJECT_VERSION>.<run>.<attempt>`,
# so every run gets a new one without a commit.
#
# Secrets: APPLE_API_KEY_ID, APPLE_API_ISSUER_ID, APPLE_API_KEY_P8 (App
# Store Connect API key, base64), KEYCHAIN_PASSWORD, optionally
# APPLE_DEVID_P12 / APPLE_DEVID_P12_PASSWORD and APPLE_DIST_P12 /
# APPLE_DIST_P12_PASSWORD (certificates as base64 .p12); without them
# Xcode signs with cloud-managed certificates (API key with the Admin role).

on:
  push:
    tags: ["apple-v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "mac: notarized Mac app; testflight: iOS and tvOS to TestFlight; both"
        type: choice
        options: [mac, testflight, both]
        default: both

concurrency:
  group: apple-release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Preview image with Xcode 27 and the macOS 27, iOS 27 and tvOS SDKs the
  # apps need; the macos-26 image stops at Xcode 26.
  XCODE_APP: /Applications/Xcode_27.1.app

jobs:
  mac:
    name: Mac app (notarized)
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/apple-v')) && (github.event_name == 'push' || inputs.target != 'testflight')
    environment: apple-release
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, for the check that the tag is on main.
          fetch-depth: 0
      - name: Tag is on main
        if: github.event_name == 'push'
        run: |
          # A tag on a commit outside main must not reach the signing data.
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points to $GITHUB_SHA, which is not on main"
            exit 1
          fi
      - name: Tag matches the app version
        if: github.event_name == 'push'
        run: |
          app="$(sed -n 's/^ *MARKETING_VERSION: "\(.*\)"$/\1/p' apps/AmiscaraAgents/project.yml)"
          if [ "${GITHUB_REF_NAME#apple-v}" != "$app" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but project.yml says MARKETING_VERSION $app"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: apple-mac
      - name: Xcode and xcodegen
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          brew install xcodegen
      - name: Signing data
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          P12: ${{ secrets.APPLE_DEVID_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: .github/scripts/apple-signing.sh
      - id: build
        name: Build, sign and notarize
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/apple/AuthKey.p8"
          base="$(sed -n 's/^ *CURRENT_PROJECT_VERSION: "\(.*\)"$/\1/p' apps/AmiscaraAgents/project.yml)"
          export BUILD_NUMBER="$base.$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
          scripts/release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: amiscara-agents-mac
          path: ${{ steps.build.outputs.zip }}
          if-no-files-found: error
      - name: Attach to the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.build.outputs.zip }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --draft --title "Amiscara Agents ${GITHUB_REF_NAME#apple-v} (Mac)" --notes "Mac-App, mit Developer ID signiert und notarisiert."
          gh release upload "$GITHUB_REF_NAME" "$ZIP" --clobber
      - name: Remove signing data
        if: always()
        run: .github/scripts/apple-signing.sh --cleanup

  testflight:
    name: TestFlight (iOS and tvOS)
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/apple-v')) && (github.event_name == 'push' || inputs.target != 'mac')
    environment: apple-release
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, for the check that the tag is on main.
          fetch-depth: 0
      - name: Tag is on main
        if: github.event_name == 'push'
        run: |
          # A tag on a commit outside main must not reach the signing data.
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points to $GITHUB_SHA, which is not on main"
            exit 1
          fi
      - name: Tag matches the app version
        if: github.event_name == 'push'
        run: |
          app="$(sed -n 's/^ *MARKETING_VERSION: "\(.*\)"$/\1/p' apps/AmiscaraAgents/project.yml)"
          if [ "${GITHUB_REF_NAME#apple-v}" != "$app" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but project.yml says MARKETING_VERSION $app"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-tvos
      - uses: Swatinem/rust-cache@v2
        with:
          key: apple-testflight
      - name: Xcode and xcodegen
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          brew install xcodegen
      - name: Signing data
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          P12: ${{ secrets.APPLE_DIST_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_DIST_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: .github/scripts/apple-signing.sh
      - name: Archive and upload
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/apple/AuthKey.p8"
          base="$(sed -n 's/^ *CURRENT_PROJECT_VERSION: "\(.*\)"$/\1/p' apps/AmiscaraAgents/project.yml)"
          export BUILD_NUMBER="$base.$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
          scripts/testflight.sh
      - name: Remove signing data
        if: always()
        run: .github/scripts/apple-signing.sh --cleanup
