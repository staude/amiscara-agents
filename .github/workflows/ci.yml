name: CI

# Runs only for release tags and when started by hand (Actions > CI > Run
# workflow), to save Actions minutes: pull requests are checked on the
# machine with scripts/check.sh. The full chain covers macOS and Windows,
# iOS and tvOS, Android and the desktop app on all systems; installers only by hand,
# a tag builds them in desktop-release.yml. With scope "installers"
# (`gh workflow run ci.yml -f scope=installers`) only the Windows (x64,
# ARM64) and Linux installers are built, without the tests on macOS and
# Windows.
on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      scope:
        description: "all: full chain with installers; installers: only the installers"
        type: choice
        options: [all, installers]
        default: all

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format and clippy
    if: inputs.scope != 'installers'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all --check
      # The desktop app needs WebKitGTK on Linux; the desktop job lints it.
      - run: cargo clippy --workspace --exclude amiscara-desktop --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    if: inputs.scope != 'installers'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test --workspace --exclude amiscara-desktop --locked --no-fail-fast

  apple-targets:
    name: Check iOS and tvOS targets
    if: inputs.scope != 'installers'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-ios, aarch64-apple-tvos
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # The apps link herdr-ffi for these targets (scripts/build-ffi.sh).
      - run: cargo check -p herdr-ffi --locked --target aarch64-apple-ios
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "27.0"
      - run: cargo check -p herdr-ffi --locked --target aarch64-apple-tvos
        env:
          TVOS_DEPLOYMENT_TARGET: "26.0"

  android:
    name: Android app
    if: inputs.scope != 'installers'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android, x86_64-linux-android
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: android
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: cargo-ndk
      # NDK and platform of app/build.gradle.kts; the runner's SDK has others.
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" "platforms;android-37.0" >/dev/null
      - run: cargo ndk -t arm64-v8a -P 29 clippy -p herdr-ffi --locked -- -D warnings
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/29.0.14206865
      # Gradle hands the NDK to scripts/build-android-ffi.sh.
      - run: ./gradlew assembleDebug lintDebug

  desktop:
    name: Desktop app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.scope == 'installers' && '["ubuntu-22.04", "windows-latest"]' || '["ubuntu-22.04", "windows-latest", "macos-15"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Debug, test and release builds plus the AppImage fill the runner's
      # disk ("No space left on device" while linuxdeploy strips libraries).
      - name: Free disk space
        if: runner.os == 'Linux' && github.event_name == 'workflow_dispatch'
        working-directory: .
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: WebKitGTK and bundler tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: desktop
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: cargo clippy -p amiscara-desktop --all-targets --locked -- -D warnings
      - run: cargo test -p amiscara-desktop --locked
      # Bundles for Windows (NSIS, MSI) and Linux (deb, AppImage), only when
      # started by hand; the Mac only checks that the app builds, it ships
      # the SwiftUI app. Without signed update files: the updater key is only
      # for the release workflow (environment desktop-release, tags desktop-v*).
      - if: github.event_name == 'workflow_dispatch' && runner.os != 'macOS'
        run: npx tauri build --verbose --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - if: github.event_name == 'workflow_dispatch' && runner.os == 'macOS'
        run: npx tauri build --no-bundle
      - if: github.event_name == 'workflow_dispatch' && runner.os != 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: amiscara-agents-${{ runner.os }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  # Windows on ARM, cross-compiled on the x64 runner; Tauri builds only the
  # NSIS installer for ARM64 (no MSI).
  desktop-windows-arm:
    name: Desktop app (Windows ARM64)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: desktop-arm64
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npx tauri build --verbose --target aarch64-pc-windows-msvc --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: amiscara-agents-Windows-ARM64
          path: target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
