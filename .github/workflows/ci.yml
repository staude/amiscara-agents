name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # The desktop app needs WebKitGTK on Linux; the desktop job lints it.
      - run: cargo clippy --workspace --exclude amiscara-desktop --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --exclude amiscara-desktop --locked --no-fail-fast

  apple-targets:
    name: Check iOS and tvOS targets
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-tvos
      - uses: Swatinem/rust-cache@v2
      # The apps link herdr-ffi for these targets (scripts/build-ffi.sh).
      - run: cargo check -p herdr-ffi --locked --target aarch64-apple-ios
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "27.0"
      - run: cargo check -p herdr-ffi --locked --target aarch64-apple-tvos
        env:
          TVOS_DEPLOYMENT_TARGET: "26.0"

  desktop:
    name: Desktop app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      # Debug, test and release builds plus the AppImage fill the runner's
      # disk ("No space left on device" while linuxdeploy strips libraries).
      - name: Free disk space
        if: runner.os == 'Linux'
        working-directory: .
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: WebKitGTK and bundler tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: cargo clippy -p amiscara-desktop --all-targets --locked -- -D warnings
      - run: cargo test -p amiscara-desktop --locked
      # Bundles for Windows (NSIS, MSI) and Linux (deb, AppImage); the Mac
      # only checks that the app builds, it ships the SwiftUI app.
      # Without signed update files: the updater key is only for the release
      # workflow (environment desktop-release, tags desktop-v*).
      - if: runner.os != 'macOS'
        run: npx tauri build --verbose --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - if: runner.os == 'macOS'
        run: npx tauri build --no-bundle
      - if: runner.os != 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: amiscara-agents-${{ runner.os }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
