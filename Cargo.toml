[workspace]
members = [
    "crates/herdr-proto",
    "crates/herdr-transport",
    "crates/herdr-spike",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Frank Neumann-Staude <frank@staude.net>"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
dbg_macro = "deny"
todo = "deny"
