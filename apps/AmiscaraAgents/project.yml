name: AmiscaraAgents
options:
  bundleIdPrefix: net.staude
  deploymentTarget:
    macOS: "27.0"
    iOS: "27.0"
    # The Apple TV 4K (AppleTV6,2) stays on tvOS 26.
    tvOS: "26.0"
    # Same as the TV (Frank, 2026-10-19).
    watchOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: de
  # Xcode checks for the XCFramework while planning, before any target runs,
  # so a fresh checkout needs it before the first build.
  postGenCommand: test -d Generated/HerdrFFI.xcframework || ../../scripts/build-ffi.sh debug all
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: "7N2W4T6UPV"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # The pre-build script runs cargo and writes Generated/, outside the sandbox.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_EMIT_LOC_STRINGS: YES
packages:
  # Updates of the Mac app, which is distributed outside the App Store
  # (UpdaterController.swift, docs/release.md).
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.2"
targets:
  AmiscaraAgents:
    type: application
    platform: macOS
    sources:
      - path: AmiscaraAgents
        excludes:
          - "**/.DS_Store"
          - Info-iOS.plist
          - Info-tvOS.plist
          - AmiscaraAgents-iOS.entitlements
          - AmiscaraAgents-tvOS.entitlements
      - path: Shared
      # Generated by scripts/build-ffi.sh, not checked in.
      - path: Generated/herdr_ffi.swift
        optional: true
    dependencies:
      # Builds the framework first; see aggregateTargets.
      - target: HerdrFFI
      - framework: Generated/HerdrFFI.xcframework
        embed: false
      - target: AmiscaraAgentsWidget
      # "Share → Amiscara Agents" on the Mac (#236).
      - target: AmiscaraAgentsShare
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.staude.amiscara.agents
        PRODUCT_NAME: AmiscaraAgents
        INFOPLIST_FILE: AmiscaraAgents/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    entitlements:
      path: AmiscaraAgents/AmiscaraAgents.entitlements
      properties:
        # Distributed with Developer ID, not through the App Store. The app
        # reaches ~/.config/herdr/herdr.sock and SSH hosts, which the
        # sandbox would block.
        com.apple.security.app-sandbox: false
        # Dictation: the hardened runtime blocks the microphone otherwise.
        com.apple.security.device.audio-input: true
        # Shares the board with the widget (Shared/WidgetSnapshot.swift).
        com.apple.security.application-groups:
          - 7N2W4T6UPV.net.staude.amiscara.agents
        # Pushes through the user's private iCloud database (#119).
        com.apple.developer.icloud-container-identifiers:
          - iCloud.net.staude.amiscara.agents
        com.apple.developer.icloud-services:
          - CloudKit
        # Commands from the Watch arrive as silent pushes (#160).
        com.apple.developer.aps-environment: development
    info:
      path: AmiscaraAgents/Info.plist
      properties:
        CFBundleDisplayName: Amiscara Agents
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "© 2026 Frank Neumann-Staude"
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: "Zum Diktieren von Prompts direkt in das Eingabefeld."
        NSSpeechRecognitionUsageDescription: "Wandelt Ihr Diktat in Text für das Eingabefeld um."
        # Handoff of the open pane (#231).
        NSUserActivityTypes:
          - net.staude.amiscara.agents.pane
        CFBundleURLTypes:
          # "Add host" links, see crates/herdr-ffi/src/add_host.rs.
          - CFBundleURLName: net.staude.amiscara.agents.add-host
            CFBundleURLSchemes:
              - amiscara-agents
        # Sparkle: the feed is an asset of the release `updates`, which
        # scripts/release.sh and apple-release.yml replace with each Mac
        # release. The public key belongs to the private key in the
        # maintainer's keychain (generate_keys --account amiscara-agents)
        # and the CI secret SPARKLE_ED_PRIVATE_KEY.
        SUFeedURL: https://github.com/staude/amiscara-agents/releases/download/updates/appcast.xml
        SUPublicEDKey: kKLJaOdPFbh5wzDWhNuiJZJHWZ6mR4l/hWsMumZiRdQ=
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: true
        SUScheduledCheckInterval: 86400
  AmiscaraAgents-iOS:
    type: application
    platform: iOS
    sources:
      - path: AmiscaraAgents
        excludes:
          - "**/.DS_Store"
          - Info.plist
          - Info-tvOS.plist
          - AmiscaraAgents.entitlements
          - AmiscaraAgents-iOS.entitlements
          - AmiscaraAgents-tvOS.entitlements
      - path: Shared
      - path: Generated/herdr_ffi.swift
        optional: true
    dependencies:
      # Builds the framework first; see aggregateTargets.
      - target: HerdrFFI
      - framework: Generated/HerdrFFI.xcframework
        embed: false
      - target: AmiscaraAgentsWidget-iOS
      # "Share → Amiscara Agents" (#225).
      - target: AmiscaraAgentsShare-iOS
      # Installed on the paired Watch together with the app (#157).
      - target: AmiscaraAgents-watchOS
    entitlements:
      path: AmiscaraAgents/AmiscaraAgents-iOS.entitlements
      properties:
        com.apple.security.application-groups:
          - group.net.staude.amiscara.agents
        # CloudKit subscriptions arrive as pushes (#119); the export for
        # TestFlight switches it to production.
        aps-environment: development
        com.apple.developer.icloud-container-identifiers:
          - iCloud.net.staude.amiscara.agents
        com.apple.developer.icloud-services:
          - CloudKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.staude.amiscara.agents
        PRODUCT_NAME: AmiscaraAgents
        TARGETED_DEVICE_FAMILY: "1,2"
        # The Rust core is built for arm64 only; macOS 27 runs on Apple silicon.
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        INFOPLIST_FILE: AmiscaraAgents/Info-iOS.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
    info:
      path: AmiscaraAgents/Info-iOS.plist
      properties:
        CFBundleDisplayName: Amiscara Agents
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "© 2026 Frank Neumann-Staude"
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: "Zum Diktieren von Prompts direkt in das Eingabefeld."
        NSSpeechRecognitionUsageDescription: "Wandelt Ihr Diktat in Text für das Eingabefeld um."
        NSCameraUsageDescription: "Zum Scannen des QR-Codes, mit dem Sie einen Host hinzufügen."
        # Handoff of the open pane (#231).
        NSUserActivityTypes:
          - net.staude.amiscara.agents.pane
        # App lock (#232).
        NSFaceIDUsageDescription: "Zum Entsperren der App, wenn Sie die App-Sperre eingeschaltet haben."
        # Working and waiting agents on the Lock Screen (#224).
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: net.staude.amiscara.agents.add-host
            CFBundleURLSchemes:
              - amiscara-agents
        NSLocalNetworkUsageDescription: "Amiscara Agents verbindet sich per SSH mit Rechnern in Ihrem Netz, auf denen herdr läuft."
        # Silent pushes for new boards in iCloud (#156).
        UIBackgroundModes:
          - remote-notification
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  # Widgets (#106): read the board the app writes into the App Group.
  AmiscaraAgentsWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: Widget
        excludes:
          - "*.entitlements"
          - "*.plist"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.staude.amiscara.agents.widget
        PRODUCT_NAME: AmiscaraAgentsWidget
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Widget/Info.plist
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
    entitlements:
      path: Widget/AmiscaraAgentsWidget.entitlements
      properties:
        # Widget extensions must be sandboxed, unlike the app.
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - 7N2W4T6UPV.net.staude.amiscara.agents
    info:
      path: Widget/Info.plist
      properties: &widgetInfo
        CFBundleDisplayName: Amiscara Agents
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  AmiscaraAgentsWidget-iOS:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
        excludes:
          - "*.entitlements"
          - "*.plist"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.staude.amiscara.agents.widget
        PRODUCT_NAME: AmiscaraAgentsWidget
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Widget/Info-iOS.plist
        SKIP_INSTALL: YES
    entitlements:
      path: Widget/AmiscaraAgentsWidget-iOS.entitlements
      properties:
        com.apple.security.application-groups:
          - group.net.staude.amiscara.agents
        # Reads the Mac's boards (#156) when the app has not run.
        com.apple.developer.icloud-container-identifiers:
          - iCloud.net.staude.amiscara.agents
        com.apple.developer.icloud-services:
          - CloudKit
    info:
      path: Widget/Info-iOS.plist
      properties: *widgetInfo
  # Share extension (#225): leaves text, links and images for the app in
  # the App Group; it holds no SSH session itself.
  AmiscaraAgentsShare-iOS:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
        excludes:
          - "*.entitlements"
          - "*.plist"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.staude.amiscara.agents.share
        PRODUCT_NAME: AmiscaraAgentsShare
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ShareExtension/Info.plist
        SKIP_INSTALL: YES
    entitlements:
      path: ShareExtension/AmiscaraAgentsShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.net.staude.amiscara.agents
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Amiscara Agents
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule: &shareActivation
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 5
              # A Markdown file to hand over (#236).
              NSExtensionActivationSupportsFileWithMaxCount: 1
  # The same on the Mac (#236): sandboxed like every extension, and it
  # opens the app itself instead of posting a notification.
  AmiscaraAgentsShare:
    type: app-extension
    platform: macOS
    sources:
      - path: ShareExtension
        excludes:
          - "*.entitlements"
          - "*.plist"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.staude.amiscara.agents.share
        PRODUCT_NAME: AmiscaraAgentsShare
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ShareExtension/Info-macOS.plist
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
    entitlements:
      path: ShareExtension/AmiscaraAgentsShare-macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - 7N2W4T6UPV.net.staude.amiscara.agents
    info:
      path: ShareExtension/Info-macOS.plist
      properties:
        CFBundleDisplayName: Amiscara Agents
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule: *shareActivation
  # Apple TV (#95, #126): the same sources; what tvOS lacks is guarded with
  # `#if !os(tvOS)` or excluded here.
  AmiscaraAgents-tvOS:
    type: application
    platform: tvOS
    sources:
      - path: AmiscaraAgents
        excludes:
          - "**/.DS_Store"
          - Info.plist
          - Info-iOS.plist
          - AmiscaraAgents.entitlements
          - AmiscaraAgents-iOS.entitlements
          - AmiscaraAgents-tvOS.entitlements
          - Views/QRScannerView.swift
          - Views/InputBar.swift
          - Model/Dictation.swift
          - Model/AgentIntents.swift
          - Views/MenuBarMenu.swift
          - Views/SecretsView.swift
          - Model/SecretStore.swift
          - Views/ChainEditor.swift
          - Views/ClaudeSessionsView.swift
          - Model/PromptTemplates.swift
          - Views/PromptTemplateEditor.swift
          - Views/PromptTemplateForm.swift
      - path: Shared
      - path: Generated/herdr_ffi.swift
        optional: true
    dependencies:
      - target: HerdrFFI
      - framework: Generated/HerdrFFI.xcframework
        embed: false
      - target: AmiscaraAgentsTopShelf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.staude.amiscara.agents
        PRODUCT_NAME: AmiscaraAgents
        TARGETED_DEVICE_FAMILY: "3"
        INFOPLIST_FILE: AmiscaraAgents/Info-tvOS.plist
        GENERATE_INFOPLIST_FILE: NO
        # Icon Composer has no tvOS: layered brand assets from
        # docs/icon/A/tvicon.swift (#130).
        ASSETCATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    entitlements:
      path: AmiscaraAgents/AmiscaraAgents-tvOS.entitlements
      properties:
        # The agents for the Top Shelf (#130), as for the widgets.
        com.apple.security.application-groups:
          - group.net.staude.amiscara.agents
        # Pairing records from the iPhone come through CloudKit (#127).
        com.apple.developer.icloud-container-identifiers:
          - iCloud.net.staude.amiscara.agents
        com.apple.developer.icloud-services:
          - CloudKit
        # App Store Connect requires it next to CloudKit; the export for
        # TestFlight switches it to production.
        aps-environment: development
    info:
      path: AmiscaraAgents/Info-tvOS.plist
      properties:
        CFBundleDisplayName: Amiscara Agents
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "© 2026 Frank Neumann-Staude"
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: "Amiscara Agents verbindet sich per SSH mit Rechnern in Ihrem Netz, auf denen herdr läuft."
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - arm64
  # Apple Watch (#157): no FFI, since watchOS gives normal apps no sockets.
  # Agents from the iPhone (WatchConnectivity) and the Mac's boards in
  # iCloud; answers go to the iPhone.
  AmiscaraAgents-watchOS:
    type: application
    platform: watchOS
    sources:
      - path: Watch
        excludes:
          - "*.entitlements"
          - "*.plist"
      - path: Shared
      - path: AmiscaraAgents/AppIcon.icon
    dependencies:
      # Complications and Smart Stack (#158).
      - target: AmiscaraAgentsWidget-watchOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.staude.amiscara.agents.watchkitapp
        PRODUCT_NAME: AmiscaraAgents
        INFOPLIST_FILE: Watch/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
        ENABLE_PREVIEWS: YES
    entitlements:
      path: Watch/AmiscaraAgentsWatch.entitlements
      properties:
        # Boards and screen excerpts from the Mac (#156).
        com.apple.developer.icloud-container-identifiers:
          - iCloud.net.staude.amiscara.agents
        com.apple.developer.icloud-services:
          - CloudKit
        # The snapshot for the complications (#158).
        com.apple.security.application-groups:
          - group.net.staude.amiscara.agents
        # A silent push per new board refreshes them (#158).
        aps-environment: development
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Amiscara Agents
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: "© 2026 Frank Neumann-Staude"
        WKApplication: true
        WKCompanionAppBundleIdentifier: net.staude.amiscara.agents
        # UIBackgroundModes: App Store Connect rejects remote-notification
        # under WKBackgroundModes.
        UIBackgroundModes:
          - remote-notification
  # Complications and Smart Stack of the Watch (#158): the snapshot the
  # Watch app leaves in the App Group, plus the Mac's boards from iCloud.
  AmiscaraAgentsWidget-watchOS:
    type: app-extension
    platform: watchOS
    sources:
      - path: WatchWidget
        excludes:
          - "*.entitlements"
          - "*.plist"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.staude.amiscara.agents.watchkitapp.widget
        PRODUCT_NAME: AmiscaraAgentsWidget
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: WatchWidget/Info.plist
        SKIP_INSTALL: YES
    entitlements:
      path: WatchWidget/AmiscaraAgentsWidget-watchOS.entitlements
      properties:
        com.apple.security.application-groups:
          - group.net.staude.amiscara.agents
        com.apple.developer.icloud-container-identifiers:
          - iCloud.net.staude.amiscara.agents
        com.apple.developer.icloud-services:
          - CloudKit
    info:
      path: WatchWidget/Info.plist
      properties: *widgetInfo
  # Top Shelf of the Apple TV (#130): agents from the App Group snapshot.
  AmiscaraAgentsTopShelf:
    type: app-extension
    platform: tvOS
    sources:
      - path: TopShelf
        excludes:
          - "*.entitlements"
          - "*.plist"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.staude.amiscara.agents.topshelf
        PRODUCT_NAME: AmiscaraAgentsTopShelf
        TARGETED_DEVICE_FAMILY: "3"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: TopShelf/Info.plist
        SKIP_INSTALL: YES
    entitlements:
      path: TopShelf/AmiscaraAgentsTopShelf.entitlements
      properties:
        com.apple.security.application-groups:
          - group.net.staude.amiscara.agents
    info:
      path: TopShelf/Info.plist
      properties:
        CFBundleDisplayName: Amiscara Agents
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentProvider
        UIRequiredDeviceCapabilities:
          - arm64
aggregateTargets:
  # Runs scripts/build-ffi.sh before either app target, as a target of its
  # own: a script phase inside the app target cannot produce the framework
  # the same target links (Xcode reports a cycle or races the script).
  HerdrFFI:
    settings:
      SUPPORTED_PLATFORMS: "macosx iphoneos iphonesimulator appletvos appletvsimulator"
      SDKROOT: auto
    buildScripts:
      - name: Build herdr-ffi
        script: |
          if [ "$CONFIGURATION" = "Release" ]; then profile=release; else profile=debug; fi
          "$SRCROOT/../../scripts/build-ffi.sh" "$profile" "$PLATFORM_NAME"
        basedOnDependencyAnalysis: false
        # Lets Xcode order the app targets' framework processing after this.
        outputFiles:
          - $(SRCROOT)/Generated/HerdrFFI.xcframework
          - $(SRCROOT)/Generated/herdr_ffi.swift
schemes:
  AmiscaraAgents:
    build:
      targets:
        AmiscaraAgents: all
    run:
      config: Debug
    archive:
      config: Release
  AmiscaraAgents-iOS:
    build:
      targets:
        AmiscaraAgents-iOS: all
    run:
      config: Debug
    archive:
      config: Release
  AmiscaraAgents-tvOS:
    build:
      targets:
        AmiscaraAgents-tvOS: all
    run:
      config: Debug
    archive:
      config: Release
  AmiscaraAgents-watchOS:
    build:
      targets:
        AmiscaraAgents-watchOS: all
    run:
      config: Debug
    archive:
      config: Release
