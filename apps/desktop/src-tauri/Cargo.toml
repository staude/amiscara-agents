[package]
name = "amiscara-desktop"
description = "Amiscara Agents for Windows and Linux (Tauri)"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true

[lib]
name = "amiscara_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
herdr-core = { version = "0.1.0", path = "../../../crates/herdr-core" }
herdr-proto = { version = "0.1.0", path = "../../../crates/herdr-proto" }
herdr-session = { version = "0.1.0", path = "../../../crates/herdr-session" }
herdr-transport = { version = "0.1.0", path = "../../../crates/herdr-transport" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.7"
tauri-plugin-process = "2.4"
tauri-plugin-updater = "2.14"
tauri-plugin-deep-link = "2.6"
tauri-plugin-opener = "2.7"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

# Keys live in the OS store: Credential Manager, Secret Service (pure Rust
# D-Bus, no libdbus), Keychain for development on the Mac.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }
tauri-winrt-notification = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["async-secret-service", "tokio", "crypto-rust"] }
notify-rust = "4.18"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2.5", features = ["deep-link"] }

[lints]
workspace = true
