name: HerdrRemote
options:
  bundleIdPrefix: net.staude
  deploymentTarget:
    macOS: "27.0"
    iOS: "27.0"
  createIntermediateGroups: true
  developmentLanguage: de
  # Xcode checks for the XCFramework while planning, before any target runs,
  # so a fresh checkout needs it before the first build.
  postGenCommand: test -d Generated/HerdrFFI.xcframework || ../../scripts/build-ffi.sh debug all
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: "7N2W4T6UPV"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # The pre-build script runs cargo and writes Generated/, outside the sandbox.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  HerdrRemote:
    type: application
    platform: macOS
    sources:
      - path: HerdrRemote
        excludes:
          - "**/.DS_Store"
          - Info-iOS.plist
      # Generated by scripts/build-ffi.sh, not checked in.
      - path: Generated/herdr_ffi.swift
        optional: true
    dependencies:
      # Builds the framework first; see aggregateTargets.
      - target: HerdrFFI
      - framework: Generated/HerdrFFI.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.staude.herdrremote
        PRODUCT_NAME: HerdrRemote
        INFOPLIST_FILE: HerdrRemote/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    entitlements:
      path: HerdrRemote/HerdrRemote.entitlements
      properties:
        # Distributed with Developer ID, not through the App Store. The app
        # reaches ~/.config/herdr/herdr.sock and SSH hosts, which the
        # sandbox would block.
        com.apple.security.app-sandbox: false
    info:
      path: HerdrRemote/Info.plist
      properties:
        CFBundleDisplayName: Herdr Remote
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "© 2026 Frank Neumann-Staude"
        ITSAppUsesNonExemptEncryption: false
  HerdrRemote-iOS:
    type: application
    platform: iOS
    sources:
      - path: HerdrRemote
        excludes:
          - "**/.DS_Store"
          - Info.plist
          - HerdrRemote.entitlements
      - path: Generated/herdr_ffi.swift
        optional: true
    dependencies:
      # Builds the framework first; see aggregateTargets.
      - target: HerdrFFI
      - framework: Generated/HerdrFFI.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.staude.herdrremote
        PRODUCT_NAME: HerdrRemote
        TARGETED_DEVICE_FAMILY: "1,2"
        # The Rust core is built for arm64 only; macOS 27 runs on Apple silicon.
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        INFOPLIST_FILE: HerdrRemote/Info-iOS.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
    info:
      path: HerdrRemote/Info-iOS.plist
      properties:
        CFBundleDisplayName: Herdr Remote
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "© 2026 Frank Neumann-Staude"
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: "Herdr Remote verbindet sich per SSH mit Rechnern in Ihrem Netz, auf denen herdr läuft."
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
aggregateTargets:
  # Runs scripts/build-ffi.sh before either app target, as a target of its
  # own: a script phase inside the app target cannot produce the framework
  # the same target links (Xcode reports a cycle or races the script).
  HerdrFFI:
    settings:
      SUPPORTED_PLATFORMS: "macosx iphoneos iphonesimulator"
      SDKROOT: auto
    buildScripts:
      - name: Build herdr-ffi
        script: |
          if [ "$CONFIGURATION" = "Release" ]; then profile=release; else profile=debug; fi
          "$SRCROOT/../../scripts/build-ffi.sh" "$profile" "$PLATFORM_NAME"
        basedOnDependencyAnalysis: false
        # Lets Xcode order the app targets' framework processing after this.
        outputFiles:
          - $(SRCROOT)/Generated/HerdrFFI.xcframework
          - $(SRCROOT)/Generated/herdr_ffi.swift
schemes:
  HerdrRemote:
    build:
      targets:
        HerdrRemote: all
    run:
      config: Debug
    archive:
      config: Release
  HerdrRemote-iOS:
    build:
      targets:
        HerdrRemote-iOS: all
    run:
      config: Debug
    archive:
      config: Release
