[package]
name = "herdr-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
herdr-proto = { version = "0.1.0", path = "../herdr-proto" }
herdr-transport = { version = "0.1.0", path = "../herdr-transport" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
unicode-width = "0.2.2"
tokio = { version = "1.53.3", features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1.53.3", features = ["io-util", "macros", "net", "rt", "sync", "time", "test-util"] }

[lints]
workspace = true
