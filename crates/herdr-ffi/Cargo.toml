[package]
name = "herdr-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
herdr-core = { version = "0.1.0", path = "../herdr-core" }
herdr-proto = { version = "0.1.0", path = "../herdr-proto" }
herdr-transport = { version = "0.1.0", path = "../herdr-transport" }
herdr-session = { version = "0.1.0", path = "../herdr-session" }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "sync", "time", "macros"] }
uniffi = "0.32.2"

# Panics in background tasks would vanish on Android (no stderr); they go
# to logcat instead.
[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15.1"
log = "0.4.34"

[lints]
workspace = true
